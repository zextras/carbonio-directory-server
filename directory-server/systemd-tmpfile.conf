# Carbonio Directory Server (OpenLDAP) directories
# See tmpfiles.d(5) for format

d /opt/zextras/data/ldap 0755 zextras zextras
d /opt/zextras/data/ldap/config 0755 zextras zextras
d /opt/zextras/data/ldap/mdb 0755 zextras zextras
d /opt/zextras/data/ldap/mdb/db 0755 zextras zextras
d /opt/zextras/data/ldap/state 0755 zextras zextras
d /opt/zextras/data/ldap/state/run 0755 zextras zextras

# Note: OpenLDAP configuration files (slapd.conf, slapd.ldif, etc.) are owned and
# managed by the carbonio-openldap package, not by this package.

# Note: OpenLDAP slapd binary permissions and setcap are handled by carbonio-openldap postinst script
# The postinst script sets: chown root:zextras, chmod 750, and setcap CAP_NET_BIND_SERVICE=+ep

# User LDAP configuration (owned by carbonio-core)
# /opt/zextras/.ldaprc is managed by carbonio-core package

